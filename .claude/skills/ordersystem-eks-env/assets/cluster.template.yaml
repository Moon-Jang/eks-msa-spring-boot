# eksctl 클러스터 설정 템플릿
#
# 레포의 1.k8s_basic/0.eks_setting/cluster.yaml 은 특정 AWS 계정(831926604059)의
# VPC/서브넷/IAM 역할 ARN이 하드코딩되어 있다. 다른 계정에서 만들 때는 이 템플릿을 복사해
# <> 부분을 채운 뒤 사용한다.
#
# 값 조회:
#   aws ec2 describe-vpcs --filters Name=isDefault,Values=true --query 'Vpcs[].VpcId' --output text
#   aws ec2 describe-subnets --filters Name=vpc-id,Values=<VPC_ID> \
#     --query 'Subnets[].{AZ:AvailabilityZone,Id:SubnetId}' --output table
#   aws sts get-caller-identity --query Account --output text
#
# 생성:
#   aws-vault exec <프로필> --duration=12h -- eksctl create cluster -f <이 파일>

apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: <클러스터명>          # 예: eks-practice
  region: ap-northeast-2
  version: "1.31"             # eksctl/EKS가 지원하는 버전인지 확인할 것

# Default VPC 재사용 (새 VPC를 만들지 않아 NAT 게이트웨이 비용이 안 든다)
# 이 항목을 통째로 지우면 eksctl이 VPC를 새로 만든다 — 그 경우 NAT GW 요금이 추가된다.
vpc:
  id: <vpc-xxxxxxxx>
  subnets:
    public:
      ap-northeast-2a: { id: <subnet-xxxxxxxx> }
      ap-northeast-2b: { id: <subnet-xxxxxxxx> }
      ap-northeast-2c: { id: <subnet-xxxxxxxx> }

iam:
  # 실습에서 IRSA(ServiceAccount ↔ IAM 역할 연동)를 쓸 거면 true로 바꾼다.
  # cluster-autoscaler를 IRSA 방식으로 붙이려면 true 필요.
  withOIDC: false
  # 미리 만들어 둔 역할을 재사용. 없으면 이 줄을 지우면 eksctl이 알아서 만든다.
  serviceRoleARN: arn:aws:iam::<계정ID>:role/AmazonEKSClusterRole

managedNodeGroups:
  - name: my-worker-node
    instanceType: t3.small     # ArgoCD + 모니터링까지 올릴 거면 t3.medium 권장
    minSize: 2
    maxSize: 2                 # cluster-autoscaler 실습 시 5 정도로 올릴 것
    desiredCapacity: 2
    volumeSize: 20
    amiFamily: AmazonLinux2023
    iam:
      instanceRoleARN: arn:aws:iam::<계정ID>:role/AmazonEKSNodeRole
      # instanceRoleARN 대신 아래처럼 정책을 붙여 eksctl에 역할 생성을 맡길 수도 있다:
      # withAddonPolicies:
      #   autoScaler: true      # cluster-autoscaler용 ASG 권한
      #   imageBuilder: true    # ECR 읽기 권한
